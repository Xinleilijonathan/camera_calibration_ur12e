[pytest]
testpaths = tests
# This machine sources /opt/ros/jazzy in the login shell, which puts the ROS
# site-packages on PYTHONPATH. pytest would then autoload ROS's launch_testing
# plugin, which fails on unrelated missing dependencies. None of the ROS
# plugins are needed here, so autoloading is disabled.
# (set PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 in the environment when running)
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
